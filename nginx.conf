
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Re-resolve the backend container's address on every request.
        # A static proxy_pass caches the IP from container start, so any
        # backend redeploy (new container, new IP) would 502 until nginx
        # restarted. Docker's embedded DNS lives at 127.0.0.11.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://spendwise-backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
