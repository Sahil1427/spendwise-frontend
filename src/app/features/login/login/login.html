<div class="login-stage">

  <!-- ── Professional ambient backdrop (see .aurora in login.scss) ── -->
  <div class="aurora" aria-hidden="true"></div>

  <!-- ── Floating brand mark ────────────────────────────────────────── -->
  <div class="stage-brand">
    <div class="brand-tile">
      <svg viewBox="0 0 32 32" fill="none">
        <rect width="32" height="32" rx="8.5" fill="url(#loginLogoBg)"/>
        <defs>
          <linearGradient id="loginLogoBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0d1b3a"/>
            <stop offset="100%" stop-color="#1e4b9c"/>
          </linearGradient>
        </defs>
        <path d="M16 5.9V26.1M20.6 9.6H13.7a3.2 3.2 0 0 0 0 6.4h4.6a3.2 3.2 0 0 1 0 6.4H10.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div>
      <span class="brand-eyebrow">Personal Finance</span>
      <span class="brand-name">SpendWise</span>
    </div>
  </div>

  <!-- ── Sign-in card ───────────────────────────────────────────────── -->
  <div class="form-pane">
    <div class="login-card">

      <div class="card-head">
        <div class="head-tile">
          <app-icon name="lock"></app-icon>
        </div>
        <div class="head-copy">
          <span class="eyebrow">Secure sign in</span>
          <h1>Welcome back</h1>
        </div>
      </div>

      <p class="card-subtitle">Sign in to SpendWise and pick up right where you left off.</p>

      <form class="login-form" (ngSubmit)="onSubmit()">
        <label class="field">
          <span class="field-label">Username</span>
          <div class="input-wrap">
            <app-icon name="user" class="input-icon"></app-icon>
            <input
              type="text"
              class="field-input"
              name="loginUsername"
              [ngModel]="username"
              (ngModelChange)="username = $event; error.set('')"
              placeholder="Enter your username"
              autocomplete="username">
          </div>
        </label>

        <label class="field">
          <span class="field-label">Password</span>
          <div class="input-wrap">
            <app-icon name="lock" class="input-icon"></app-icon>
            <input
              type="password"
              class="field-input"
              name="loginPassword"
              [ngModel]="password"
              (ngModelChange)="password = $event; error.set('')"
              placeholder="••••••••••"
              autocomplete="current-password">
          </div>
        </label>

        @if (error()) {
          <p class="login-error" role="alert">{{ error() }}</p>
        }

        <button
          type="submit"
          class="login-submit"
          [disabled]="busy()">
          @if (busy()) {
            Signing in…
          } @else {
            Sign in <app-icon name="arrow-right"></app-icon>
          }
        </button>
      </form>

      <div class="card-foot">
        <app-icon name="shield"></app-icon>
        <span>Local-first — your data never leaves this device.</span>
      </div>

    </div>
  </div>
</div>
